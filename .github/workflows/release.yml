name: release

on:
  push:
    tags:
      - "v*-milton.*"

permissions: {}

jobs:
  release:
    name: build, attest and publish arm64 macOS binary
    runs-on: macos-15
    environment: release
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: swift version
        run: swift --version

      - name: build
        run: swift build -c release --arch arm64

      - name: stage
        run: |
          BIN=.build/arm64-apple-macosx/release/parrot
          file "$BIN"
          mkdir -p dist
          cp "$BIN" dist/parrot

      - name: strip
        run: strip -x dist/parrot

      # Run on the stripped binary that ships, so the spec describes exactly
      # that build. Consumers bind their model pins to this file; it is never
      # written by hand.
      - name: model spec
        working-directory: dist
        run: |
          set -euo pipefail
          ./parrot models spec > parrot-model-spec.json
          jq -e '.schema == 1
            and (.store.default_path | startswith("~/"))
            and (.models | length > 0)
            and all(.models[]; (.variant_path | startswith("models/"))
              and (.variant_pieces | length > 0))' parrot-model-spec.json
          cat parrot-model-spec.json

      - name: package
        run: |
          cd dist
          tar -czf parrot-macos-arm64.tar.gz parrot
          shasum -a 256 parrot-macos-arm64.tar.gz > parrot-macos-arm64.tar.gz.sha256
          ls -lh

      - name: attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          # One attestation, both subjects: the bundle downloaded below for the
          # tarball also verifies the spec.
          subject-path: |
            dist/parrot-macos-arm64.tar.gz
            dist/parrot-model-spec.json

      - name: verify the attestation we just minted
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          have=$(gh --version | head -1 | awk '{print $3}')
          need=2.49.0
          if [ "$(printf '%s\n%s\n' "$need" "$have" | sort -V | head -1)" != "$need" ]; then
            echo "gh $have is older than $need, which lacks a usable 'gh attestation verify'" >&2
            exit 1
          fi
          for f in parrot-macos-arm64.tar.gz parrot-model-spec.json; do
            gh attestation verify "$f" \
              --repo Milton-Group/parrot \
              --signer-workflow Milton-Group/parrot/.github/workflows/release.yml \
              --source-ref "refs/tags/${GITHUB_REF_NAME}"
          done

      - name: download the attestation bundle for vendoring
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh attestation download parrot-macos-arm64.tar.gz --repo Milton-Group/parrot
          # gh names the bundle after the subject digest ("sha256:<hex>.jsonl").
          # Glob for it rather than reconstructing the name, so a change in that
          # convention fails loudly here instead of publishing a release whose
          # bundle the infra pin PR then cannot vendor.
          shopt -s nullglob
          bundles=(*.jsonl)
          if [ "${#bundles[@]}" -ne 1 ]; then
            echo "expected exactly one downloaded attestation bundle, got ${#bundles[@]}" >&2
            exit 1
          fi
          mv "${bundles[0]}" parrot-macos-arm64.tar.gz.sigstore.json
          # The spec must verify offline against the same bundle, or a consumer
          # vendoring only that bundle could not check it.
          gh attestation verify parrot-model-spec.json \
            --bundle parrot-macos-arm64.tar.gz.sigstore.json \
            --repo Milton-Group/parrot \
            --signer-workflow Milton-Group/parrot/.github/workflows/release.yml \
            --source-ref "refs/tags/${GITHUB_REF_NAME}"
          ls -lh

      - name: release notes
        working-directory: dist
        run: |
          set -euo pipefail
          digest=$(shasum -a 256 parrot-macos-arm64.tar.gz | awk '{print $1}')
          spec_digest=$(shasum -a 256 parrot-model-spec.json | awk '{print $1}')
          cat > notes.md <<EOF
          Milton fork build of parrot, arm64 macOS, built and attested by
          \`.github/workflows/release.yml\` from tag \`${GITHUB_REF_NAME}\`
          (commit \`${GITHUB_SHA}\`).

          \`parrot-macos-arm64.tar.gz\` sha256: \`${digest}\`

          \`parrot-model-spec.json\` sha256: \`${spec_digest}\` (the model store
          layout this build expects; the same attestation covers it)

          Verify before pinning:

          \`\`\`
          gh attestation verify parrot-macos-arm64.tar.gz \\
            --bundle parrot-macos-arm64.tar.gz.sigstore.json \\
            --repo Milton-Group/parrot \\
            --signer-workflow Milton-Group/parrot/.github/workflows/release.yml \\
            --source-ref refs/tags/${GITHUB_REF_NAME}
          \`\`\`

          The same command with \`parrot-model-spec.json\` in place of the
          tarball verifies the spec.

          Unsigned binary: the per-user TCC grants and the digest pin in
          Milton-Group/infra are the trust story. See MILTON.md.
          EOF
          cat notes.md

      - name: publish release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            parrot-macos-arm64.tar.gz \
            parrot-macos-arm64.tar.gz.sha256 \
            parrot-macos-arm64.tar.gz.sigstore.json \
            parrot-model-spec.json \
            --verify-tag \
            --notes-file notes.md
