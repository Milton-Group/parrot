name: ci

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test and build arm64 macOS binary
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: swift version
        run: swift --version

      - name: test
        run: swift test

      - name: build release
        run: swift build -c release --arch arm64

      - name: verify release CLI excludes debug WAV option
        run: |
          set -euo pipefail
          BIN=.build/arm64-apple-macosx/release/parrot
          if "$BIN" run --help | grep -F -- '--dump-wav'; then
            echo "release help unexpectedly exposes --dump-wav" >&2
            exit 1
          fi

          set +e
          output=$("$BIN" run --dump-wav 2>&1)
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "release binary unexpectedly accepted --dump-wav" >&2
            exit 1
          fi
          printf '%s\n' "$output" | grep -F -- "Unknown option '--dump-wav'"
